<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Daily Workout Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="topnav">
    <span class="brand">🏋️ Daily Workout</span>
    <div class="nav-links">
      <a href="history.html">History</a>
      <a href="progress.html">Progress</a>
      <a href="plan.html">Plan</a>
    </div>
  </nav>

  <main class="container">
    <div id="setup-warning" class="setup-warning" style="display:none">
      Setup needed: this app can't save your entries yet because
      <code>js/config.js</code> still has placeholder Supabase values.
      See the README for the quick setup steps.
    </div>

    <header class="day-header">
      <h1 id="day-title">Loading…</h1>
      <div class="session-meta" id="session-meta"></div>
      <div class="note" id="session-note"></div>
    </header>

    <div class="timer-card">
      <div class="timer-readout">
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-label" id="timer-label">Ready</div>
      </div>
      <div class="timer-buttons">
        <button type="button" class="timer-btn" id="timer-stopwatch-btn">Start</button>
        <button type="button" class="timer-btn" id="timer-20-btn">20s</button>
        <button type="button" class="timer-btn" id="timer-10-btn">10s</button>
        <button type="button" class="timer-btn timer-reset" id="timer-reset-btn" title="Reset">⟲</button>
      </div>
    </div>

    <div id="exercise-list"></div>

    <div class="save-bar" id="save-bar" style="display:none">
      <button class="save-btn" id="save-btn">Save today's entries</button>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/exercise-library.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/schedule-store.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

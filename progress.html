<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <title>Workout Progress</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="topnav">
    <span class="brand">🏋️ Daily Workout</span>
    <div class="nav-links">
      <a href="index.html">Today</a>
      <a href="history.html">History</a>
      <a href="plan.html">Plan</a>
      <a href="exercises.html">Exercises</a>
    </div>
  </nav>
  <div class="user-bar" id="user-bar"></div>

  <main class="container">
    <div id="setup-warning" class="setup-warning" style="display:none">
      Setup needed: this app can't load your progress yet because
      <code>js/config.js</code> still has placeholder Supabase values.
      See the README for the quick setup steps.
    </div>

    <header class="day-header">
      <h1>Progress</h1>
      <div class="session-meta">Track one exercise over time</div>
    </header>

    <div class="filter-row">
      <div class="field">
        <label for="exercise-select">Exercise</label>
        <select id="exercise-select"></select>
      </div>
    </div>

    <div id="chart-area"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>

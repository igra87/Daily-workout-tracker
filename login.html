<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Log in — Daily Workout Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="topnav">
    <span class="brand">🏋️ Daily Workout</span>
  </nav>

  <main class="container">
    <div id="setup-warning" class="setup-warning" style="display:none">
      Setup needed: this app isn't connected to a database yet because
      <code>js/config.js</code> still has placeholder Supabase values.
      See the README for the quick setup steps.
    </div>

    <header class="day-header">
      <h1 id="auth-title">Log in</h1>
    </header>

    <form id="auth-form" class="auth-card">
      <div class="field">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" class="save-btn" id="submit-btn">Log in</button>
      <div class="status-msg" id="status-msg"></div>
      <a href="#" id="toggle-mode-link" class="toggle-mode-link">Need an account? Sign up</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
